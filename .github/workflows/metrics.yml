name: Monochrome Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate cards
        run: node .github/workflows/scripts/metrics.mjs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.plugin.languages.svg metrics.plugin.overview.svg
          git diff --staged --quiet || (git commit -m "chore: refresh metrics" && git push)
