name: Dynamic Monochrome Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Languages Metric
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.languages.svg
          base: ""

          config_theme: dark
          config_colors: |
            text: #c9c9c9
            icon: #555555
            title: #c9c9c9
            background: #0a0a0a
            
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          repositories_batch: 100

          plugin_languages_analysis_threshold: 0%

          plugin_languages_colors: |
            javascript: #d0d0d0
            shell: #aaaaaa
            css: #888888
            typescript: #666666
            tsx: #555555
            lua: #444444
            python: #333333
            astro: #222222
            html: #222222
            qml: #cccccc
            c++: #999999

          config_timezone: UTC
