name: Dynamic Monochrome Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Languages Metric
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          repositories_batch: 100
          # Monochromatic silver/gray palette matching #0a0a0a / #c9c9c9 theme
          plugin_languages_colors: "javascript:#c9c9c9, typescript:#9f9f9f, shell:#666666, lua:#444444, html:#333333, css:#222222, python:#b0b0b0, c++:#808080"
          config_timezone: UTC
