name: Dynamic Monochrome Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Card 1: Pure Minimal Languages
      - name: Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.languages.svg
          base: ""
          
          config_theme: dark
          config_colors: "text:#c9c9c9, icon:#666666, title:#c9c9c9, background:#0a0a0a"
          
          config_style: |
            .header, .title, a { color: #c9c9c9 !important; fill: #c9c9c9 !important; text-decoration: none !important; }
            .subtext, small, .field.small, h2, h3 { display: none !important; }

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          repositories_batch: 100
          
          plugin_languages_colors: "javascript:#d0d0d0, shell:#aaaaaa, css:#888888, typescript:#666666, tsx:#555555, lua:#444444, python:#333333, astro:#222222, html:#222222, qml:#cccccc, c++:#999999"

          config_timezone: UTC

      # Card 2: Pure Minimal Activity Stats
      - name: Activity Overview Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.overview.svg
          base: activity
          
          config_theme: dark
          config_colors: "text:#c9c9c9, icon:#666666, title:#c9c9c9, background:#0a0a0a"
          
          config_style: |
            .header, .title, a { color: #c9c9c9 !important; fill: #c9c9c9 !important; text-decoration: none !important; }
            .octicon { fill: #666666 !important; }
            .subtext, small, .field.small { display: none !important; }

          config_timezone: UTC
